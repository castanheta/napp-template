openapi: 3.0.3 
info:
  title: Slice management API
  description: A complete API for slice management and authentication
  version: 1.0.0

paths:
#---------------------------------------ran-----------------------------------------
  /ran/antenna/activate:
    post:
      summary: Activate an antenna in the ran
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                antenna_id:
                  type: string
                  description: The unique identifier of the antenna to be activated
                ran:
                  type: string
                  description: The ran where the antenna is located
              required:
                - antenna_id
                - ran
      responses:
        '200':
          description: Antenna activated successfully
        '404':
          description: Antenna not found
        '500':
          description: Internal server error
  /ran/antenna/deactivate:
    post:
      summary: Deactivate an antenna in the ran
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                antenna_id:
                  type: string
                  description: The unique identifier of the antenna to be deactivated
                ran:
                  type: string
                  description: The ran where the antenna is located
              required:
                - antenna_id
                - ran
      responses:
        '200':
          description: Antenna deactivated successfully
        '404':
          description: Antenna not found
        '500':
          description: Internal server error
  /ran/antenna/modify:
    put:
      summary: Modify an antenna in the ran
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                antenna_id:
                  type: string
                  description: The unique identifier of the antenna to be modified
                modifications:
                  type: object
                  description: The new parameters for the antenna
                  properties:
                    MIMO:
                      type: boolean
                      description: MIMO on/off
                    max_transmit_power:
                      type: number
                      description: Maximum transmit power
                ran:
                  type: string
                  description: The ran where the antenna is located
              required:
                - antenna_id
                - modifications
                - ran
      responses:
        '200':
          description: Antenna modified successfully
        '400':
          description: Bad request - invalid input parameters
        '404':
          description: Antenna not found
        '500':
          description: Internal server error

  
  /ran/antenna/list:
    get:
      summary: List all antennas in the ran and their statuses
      parameters:
        - in: query
          name: ran
          schema:
            type: string
          required: true
          description: The ran to list antennas from
        - in: query
          name: antenna_id
          schema:
            type: string
          required: true
          description: The unique identifier of the antenna to filter by
      responses:
        '200':
          description: List of antennas retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  antennas:
                    type: array
                    items:
                      type: object
                      properties:
                        nr_cell_id:
                          type: integer
                        cell_name:
                          type: string
                        cell_available_state:
                          type: string
                        nr_cell_state:
                          type: string
                        nr_du_cell_state:
                          type: string
                        cell_latest_state_change_reason:
                          type: string
                        latest_time_cell_available:
                          type: string
                        latest_operation_make_cell_available:
                          type: string
                        latest_time_cell_unavailable:
                          type: string
                        latest_operation_make_nr_cell_unavailable:
                          type: string
                        cell_control_node_information:
                          type: string
                        time_cell_state_change_to_unavailable:
                          type: string
                        time_last_config_before_cell_unavailable:
                          type: string
                        number_of_results:
                          type: integer
                  retcode:
                    type: integer
                  message:
                    type: string
        '404':
          description: Ran not found
        '500':
          description: Internal server error