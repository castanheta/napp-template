components:
  schemas:
    AdministrativeState:
      title: AdministrativeState
      enum:
        - LOCKED
        - UNLOCKED
        - SHUTTINGDOWN
      description: An enumeration.
    Cause:
      title: Cause
      enum:
        - CUSTOMER_DEF
        - ILLEGAL_UE
        - ILLEGAL_ME
        - SRV_NOT_ALLOW
        - PLMN_NOT_ALLOW
        - AREA_NOT_ALLOW
        - ROAM_NOT_ALLOW
        - N1_NOT_ALLOW
        - PEI_NOT_ALLOW
        - UE_UN_DERIVED
        - IMPLICIT_DEREG
        - NO_CELL_IN_TA
        - NON_3GPP_NOT_ALLOW
      description: An enumeration.
    DelayTolerance:
      title: DelayTolerance
      enum:
        - SUPPORTED
        - NOT_SUPPORTED
      description: An enumeration.
    DeterministicCommAvailability:
      title: DeterministicCommAvailability
      enum:
        - SUPPORTED
        - NOT_SUPPORTED
      description: An enumeration.
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    Mode:
      title: Mode
      enum:
        - IMPLICIT
        - EXPLICIT
      description: An enumeration.
    NBIoT:
      title: NBIoT
      enum:
        - SUPPORTED
        - NOT_SUPPORTED
      description: An enumeration.
    OperationalState:
      title: OperationalState
      enum:
        - ENABLED
        - DISABLED
      description: An enumeration.
    ThptUnit:
      title: ThptUnit
      enum:
        - bps
        - Kbps
        - Mbps
        - Gbps
        - Tbps
      description: An enumeration.
    TopSliceCreate:
      title: TopSliceCreate
      required:
        - coverage_area
        - operational_state
        - administrative_state
        - sst
        - sd
        - dnn
        - id
      type: object
      properties:
        coverage_area:
          title: Coverage Area
          type: array
          items: {}
        plmnid:
          title: Plmnid
          type: integer
        operational_state:
          $ref: '#/components/schemas/OperationalState'
        administrative_state:
          $ref: '#/components/schemas/AdministrativeState'
        sst:
          title: Sst
          type: integer
        sd:
          title: Sd
          type: string
        prioritylabel:
          title: Prioritylabel
          type: integer
        dllatency:
          title: Dllatency
          type: integer
        ullatency:
          title: Ullatency
          type: integer
        maxnumberofues:
          title: Maxnumberofues
          type: integer
        dlguathptperue:
          title: Dlguathptperue
          type: number
        ulguathptperue:
          title: Ulguathptperue
          type: number
        dlmaxthptperue:
          title: Dlmaxthptperue
          type: number
        ulmaxthptperue:
          title: Ulmaxthptperue
          type: number
        dlguathptperslice:
          title: Dlguathptperslice
          type: number
        ulguathptperslice:
          title: Ulguathptperslice
          type: number
        dlmaxthptperslice:
          title: Dlmaxthptperslice
          type: number
        ulmaxthptperslice:
          title: Ulmaxthptperslice
          type: number
        dlmaxpktsize:
          title: Dlmaxpktsize
          type: integer
        ulmaxpktsize:
          title: Ulmaxpktsize
          type: integer
        maxnumberofpdusessions:
          title: Maxnumberofpdusessions
          type: integer
        nroperatingbands:
          title: Nroperatingbands
          type: string
        slicesimultaneoususe:
          $ref: '#/components/schemas/sliceuse'
        delaytolerance:
          $ref: '#/components/schemas/DelayTolerance'
        energyefficiency:
          $ref: '#/components/schemas/energyKPI'
        termdensity:
          title: Termdensity
          type: integer
        activityfactor:
          title: Activityfactor
          type: number
        resourcesharinglevel:
          $ref: '#/components/schemas/sharing'
        uemobilitylevel:
          $ref: '#/components/schemas/uEmobilityLevel'
        uespeed:
          title: Uespeed
          type: integer
        reliability:
          title: Reliability
